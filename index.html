<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kanban Kart ve Adres Takip Paneli</title>
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    .card-shadow { box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.06); }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

  <!-- Üst Başlık / Header -->
  <header class="bg-slate-900 text-white sticky top-0 z-40 shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-2">
      <div>
        <h1 class="text-base md:text-xl font-bold tracking-tight text-white flex items-center gap-2">
          <i class="fa-solid fa-boxes-stacked text-blue-400"></i> KANBAN KART VE ADRES TAKİP
        </h1>
        <p class="text-[11px] md:text-xs text-slate-400">Montaj | Kol | Talaşlı İmalat | Yarımamul | Pompa Kumanda</p>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="syncLiveSheets(true)" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition active:scale-95">
          <i id="syncIcon" class="fa-solid fa-arrows-rotate text-blue-400"></i>
          <span class="hidden sm:inline">Listeyi Yenile</span>
        </button>

        <span class="text-xs bg-slate-800 border border-slate-700 text-slate-300 px-2.5 py-1.5 rounded-lg font-mono">
          Toplam Parça: <strong id="totalCount" class="text-blue-400 text-sm">0</strong>
        </span>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-3 md:p-6 space-y-4">

    <!-- Bilgi Çubuğu -->
    <div id="statusAlert" class="text-xs bg-blue-50 border border-blue-200 text-blue-800 px-3.5 py-2 rounded-xl flex items-center justify-between shadow-sm">
      <span id="statusText" class="flex items-center gap-2 font-medium">
        <i class="fa-solid fa-circle-check text-emerald-600"></i> Montaj, Kol ve Talaşlı İmalat hazır yüklendi.
      </span>
      <span id="lastSyncTime" class="text-[11px] text-slate-400 font-mono"></span>
    </div>

    <!-- ARAMA MOTORU VE BÖLÜM BUTONLARI -->
    <section class="bg-white rounded-xl p-4 md:p-5 card-shadow border border-slate-200 space-y-3">
      <div class="relative">
        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 text-base">
          <i class="fa-solid fa-magnifying-glass"></i>
        </span>
        <input 
          type="text" 
          id="searchInput" 
          autofocus
          oninput="renderUI()" 
          placeholder="Malzeme kodu yazın (örn: 11120154, 21036106) veya ad, raf, kutu tipi arayın..." 
          class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white text-base font-semibold transition"
        >
      </div>

      <!-- Kategori Butonları (5 Bölüm) -->
      <div class="flex flex-wrap gap-2 text-xs font-medium" id="filterPillsContainer"></div>
    </section>

    <!-- TABLO ALANI -->
    <section class="bg-white rounded-xl card-shadow border border-slate-200 overflow-hidden">
      <div class="px-4 py-2.5 border-b border-slate-100 flex items-center justify-between bg-slate-50">
        <span class="text-xs font-bold uppercase tracking-wider text-slate-600 flex items-center gap-1.5">
          <i class="fa-solid fa-list-check text-blue-600"></i> Bulunan Parçalar ve Konumlar
        </span>
        <span id="resultInfo" class="text-xs text-slate-500 font-mono">0 kayıt</span>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs border-collapse">
          <thead>
            <tr class="bg-slate-100 text-slate-700 uppercase font-bold border-b border-slate-200 text-[11px]">
              <th class="py-3 px-3">Bölüm</th>
              <th class="py-3 px-3">Malzeme Kodu</th>
              <th class="py-3 px-3">Malzeme Adı</th>
              <th class="py-3 px-3 text-center">Kanban Adresi</th>
              <th class="py-3 px-3 text-center text-blue-700 font-extrabold">Raf</th>
              <th class="py-3 px-3 text-center text-indigo-700 font-extrabold">Kat</th>
              <th class="py-3 px-3 text-center text-emerald-700 font-extrabold">Sıra</th>
              <th class="py-3 px-3 text-center text-purple-700">Ambar</th>
              <th class="py-3 px-3 text-center text-amber-700 font-extrabold">Kutu Tipi</th>
              <th class="py-3 px-3 text-center text-rose-700 font-extrabold">Kapasite / Miktar</th>
            </tr>
          </thead>
          <tbody id="resultBody" class="divide-y divide-slate-100 text-slate-700">
            <tr>
              <td colspan="10" class="text-center py-10 text-slate-400">Veriler yükleniyor...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script>
    // 3 DOSYADAN ÇIKAN VERİLER (Pompa ve Yarımamul listesi olmadığı için tamamen boş: 0 parça)
    const SECTIONS = [
      { id: "montaj", name: "Montaj" },
      { id: "kol", name: "Kol" },
      { id: "talasli", name: "Talaşlı İmalat" },
      { id: "yarimamul", name: "Yarımamul" },
      { id: "pompa", name: "Pompa Kumanda" }
    ];

    const SHEETS_CONFIG = [
      { id: "11NAiDDg3HoUUzztYeZ5B4XcQA4kIkw3ynzCifoMp_Yc", sheet: "Toplu Liste", dept: "Montaj" },
      { id: "1NIDTg038eeXpaWAOPvTLPkPilUia1uiP6delLNVS1zg", sheet: "Toplu Liste", dept: "Kol" },
      { id: "1N87Wa0fKetxCL7QB4-l6NgFY4kUcGWXvNCF1QCEA4ME", sheet: "Güncel Liste", dept: "Talaşlı İmalat" }
    ];

    let store = [];
    let currentFilter = "Tümü";

    window.addEventListener("DOMContentLoaded", () => {
      localStorage.clear();
      renderFilterPills();
      renderUI();
      syncLiveSheets(false);
    });

    function renderFilterPills() {
      const container = document.getElementById("filterPillsContainer");
      const totalCount = store.length;
      let html = `<button onclick="setFilter('Tümü')" class="filter-btn px-3 py-1.5 rounded-lg ${currentFilter === 'Tümü' ? 'bg-blue-600 text-white font-medium shadow-sm' : 'bg-slate-100 hover:bg-slate-200 text-slate-700'}">Tümü (${totalCount})</button>`;

      SECTIONS.forEach(sec => {
        const cnt = store.filter(i => i.dept === sec.name).length;
        const isActive = currentFilter === sec.name;
        html += `<button onclick="setFilter('${sec.name}')" class="filter-btn px-3 py-1.5 rounded-lg ${isActive ? 'bg-blue-600 text-white font-medium shadow-sm' : 'bg-slate-100 hover:bg-slate-200 text-slate-700'}">${sec.name} (${cnt})</button>`;
      });

      container.innerHTML = html;
    }

    function setFilter(dept) {
      currentFilter = dept;
      renderFilterPills();
      renderUI();
    }

    function getKutuBadge(kutu) {
      const k = (kutu || "").toLowerCase();
      if (k.includes("plastik")) {
        return `<span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-semibold bg-blue-100 text-blue-800 border border-blue-200">
                  <i class="fa-solid fa-box text-[9px] mr-1 text-blue-600"></i>Plastik Kutu
                </span>`;
      } else if (k.includes("kazan")) {
        return `<span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-semibold bg-purple-100 text-purple-800 border border-purple-200">
                  <i class="fa-solid fa-cube text-[9px] mr-1 text-purple-600"></i>Kazan
                </span>`;
      } else {
        return `<span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-semibold bg-amber-100 text-amber-800 border border-amber-200">
                  <i class="fa-solid fa-box-open text-[9px] mr-1 text-amber-600"></i>${kutu || 'Kutu'}
                </span>`;
      }
    }

    function parseShelfAddress(addrStr) {
      if (!addrStr || addrStr === "-" || addrStr.trim() === "") {
        return { raf: "-", kat: "-", sira: "-" };
      }
      let s = addrStr.trim();
      let raf = "-", kat = "-", sira = "-";

      const m_raf = s.match(/\bR\s*([0-9]+[A-Z]?)\b/i) || s.match(/R([0-9]+)/i);
      if (m_raf) raf = "R" + m_raf[1].toUpperCase();

      const m_kat = s.match(/\bK\s*([0-9]+(?:[\s,/K]+[0-9]+)*)/i);
      if (m_kat) {
        const kval = m_kat[1].split("-")[0].trim();
        kat = "K" + kval.toUpperCase();
      }

      const m_sira = s.match(/\bS\s*([0-9]+(?:[\s,/-]+[0-9]+)*)/i);
      if (m_sira) sira = "S" + m_sira[1].toUpperCase();

      return { raf, kat, sira };
    }

    async function syncLiveSheets(isManual) {
      const syncIcon = document.getElementById("syncIcon");
      if (syncIcon) syncIcon.classList.add("fa-spin");

      let updatedStore = [];

      try {
        for (const cfg of SHEETS_CONFIG) {
          const url = `https://docs.google.com/spreadsheets/d/${cfg.id}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(cfg.sheet)}&t=${new Date().getTime()}`;
          
          try {
            const resp = await fetch(url);
            const text = await resp.text();
            const jsonStr = text.replace(/^[/*\sO_o]*google\.visualization\.Query\.setResponse\(/, "").replace(/\);?\s*$/, "");
            const parsed = JSON.parse(jsonStr);

            if (parsed && parsed.table) {
              const rows = parsed.table.rows;
              const cols = parsed.table.cols.map(c => (c.label || "").trim().toLowerCase());

              rows.forEach(r => {
                const c = r.c;
                if (!c) return;

                let rowObj = {};
                cols.forEach((colName, idx) => {
                  if (c[idx]) {
                    const val = (c[idx].f !== undefined && c[idx].f !== null) ? c[idx].f : c[idx].v;
                    rowObj[colName] = (val !== null && val !== undefined) ? String(val).trim() : "";
                  }
                });

                const getVal = (idx) => (c[idx] ? ((c[idx].f !== undefined ? c[idx].f : c[idx].v) || "") : "").toString().trim();
                
                let code = rowObj["stok kodu"] || rowObj["kod"] || rowObj["malzeme kodu"] || getVal(1) || getVal(0);
                if (code.endsWith(".0")) code = code.slice(0, -2);

                let name = rowObj["stok adı"] || rowObj["stok adi"] || rowObj["kod adı"] || rowObj["kod adi"] || getVal(2) || getVal(1);
                let qty = rowObj["kutu kapasitesi"] || rowObj["toplu işleme miktarı"] || rowObj["kanban miktarı"] || rowObj["miktar"] || getVal(3);
                if (qty.endsWith(".0")) qty = qty.slice(0, -2);
                if (!qty) qty = "-";

                let addr = rowObj["adresi"] || rowObj["adres"] || rowObj["kanban adresi"] || rowObj["talaşlı i̇malat kanban"] || getVal(4);
                let ambar = rowObj["ambar adres"] || rowObj["ambar adresi"] || rowObj["ambar"] || getVal(5) || "-";
                
                let kutu = "Kutu";
                if (cfg.dept === "Talaşlı İmalat") {
                  kutu = "Plastik Kutu";
                } else {
                  let rawKutu = rowObj["kutu tipi"] || rowObj["kutu"] || getVal(6);
                  if (rawKutu && rawKutu.toUpperCase().includes("KAZAN")) kutu = "Kazan";
                }

                if (code && /^\d{5,10}$/.test(code) && code.toLowerCase() !== "stok kodu" && code.toLowerCase() !== "kod") {
                  const parsedAddr = parseShelfAddress(addr);
                  updatedStore.push({
                    dept: cfg.dept,
                    code,
                    name: name || "-",
                    address: addr || "-",
                    raf: parsedAddr.raf,
                    kat: parsedAddr.kat,
                    sira: parsedAddr.sira,
                    ambar: ambar || "-",
                    kutu,
                    qty: qty || "-",
                    desc: ""
                  });
                }
              });
            }
          } catch(e) {}
        }

        if (updatedStore.length > 0) {
          store = updatedStore;
          const nowStr = new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
          document.getElementById("statusText").innerHTML = `<i class="fa-solid fa-circle-check text-emerald-600"></i> Google E-Tablolar doğrudan senkronize edildi (${store.length} parça).`;
          document.getElementById("lastSyncTime").innerText = `Son Güncelleme: ${nowStr}`;
        }

      } catch (err) {
      } finally {
        if (syncIcon) syncIcon.classList.remove("fa-spin");
        renderFilterPills();
        renderUI();
      }
    }

    function renderUI() {
      const search = (document.getElementById("searchInput").value || "").toLowerCase().trim();
      document.getElementById("totalCount").innerText = store.length;

      let filtered = store;
      if (currentFilter !== "Tümü") {
        filtered = filtered.filter(i => i.dept === currentFilter);
      }

      if (search) {
        filtered = filtered.filter(i => 
          i.code.toLowerCase().includes(search) ||
          i.name.toLowerCase().includes(search) ||
          i.address.toLowerCase().includes(search) ||
          i.raf.toLowerCase().includes(search) ||
          i.kat.toLowerCase().includes(search) ||
          i.sira.toLowerCase().includes(search) ||
          i.ambar.toLowerCase().includes(search) ||
          i.kutu.toLowerCase().includes(search) ||
          i.qty.toLowerCase().includes(search) ||
          (i.desc && i.desc.toLowerCase().includes(search))
        );
      }

      document.getElementById("resultInfo").innerText = `${filtered.length} kayıt listeleniyor`;

      const tbody = document.getElementById("resultBody");
      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="10" class="text-center py-12 text-slate-400 font-medium">Bu bölüme ait parça listesi bulunmamaktadır.</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.slice(0, 300).map(item => `
        <tr class="hover:bg-blue-50/50 transition border-b border-slate-100">
          <td class="py-2.5 px-3 font-semibold text-slate-700 whitespace-nowrap">
            <span class="inline-block px-2 py-0.5 rounded text-[11px] bg-slate-100 border text-slate-600 font-medium">${item.dept}</span>
          </td>
          <td class="py-2.5 px-3 font-mono font-bold text-blue-700 text-xs whitespace-nowrap">${item.code}</td>
          <td class="py-2.5 px-3 min-w-[200px]">
            <div class="font-bold text-slate-800 text-xs">${item.name}</div>
            ${item.desc ? `<div class="text-[10px] text-slate-500 font-medium mt-0.5"><i class="fa-solid fa-tag text-[9px] mr-1 text-slate-400"></i>${item.desc}</div>` : ''}
          </td>
          <td class="py-2.5 px-3 text-center whitespace-nowrap">
            <span class="inline-block px-2 py-0.5 rounded text-[11px] font-mono font-bold bg-amber-50 text-amber-900 border border-amber-200">${item.address}</span>
          </td>
          <td class="py-2.5 px-3 text-center font-extrabold text-blue-800 bg-blue-50/40 text-xs whitespace-nowrap">${item.raf}</td>
          <td class="py-2.5 px-3 text-center font-extrabold text-indigo-800 bg-indigo-50/40 text-xs whitespace-nowrap">${item.kat}</td>
          <td class="py-2.5 px-3 text-center font-extrabold text-emerald-800 bg-emerald-50/40 text-xs whitespace-nowrap">${item.sira}</td>
          <td class="py-2.5 px-3 text-center font-mono font-semibold text-purple-800 bg-purple-50/40 text-xs whitespace-nowrap">${item.ambar}</td>
          <td class="py-2.5 px-3 text-center whitespace-nowrap">
            ${getKutuBadge(item.kutu)}
          </td>
          <td class="py-2.5 px-3 text-center whitespace-nowrap">
            <span class="inline-block px-2.5 py-0.5 rounded text-xs font-mono font-extrabold bg-rose-50 text-rose-700 border border-rose-200">
              ${item.qty}
            </span>
          </td>
        </tr>
      `).join("");
    }
  </script>
</body>
</html>
